name: Deploy synzy-clg-Backend to VPS

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/synzy-clg-test/mycampusinfo-server

            git pull origin stage

            npm install

            pm2 reload synzy-clg-test || pm2 start server.js --name synzy-clg-test
